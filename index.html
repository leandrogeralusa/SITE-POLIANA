    <script>
      // estado de "antes da entrada" só quando há movimento; trava de segurança de 6 s
      (function () {
        var r = document.documentElement;
        r.classList.add('pronto');
        if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
          r.classList.add('pre-entrada');
          setTimeout(function () { r.classList.remove('pre-entrada'); }, 6000);
        }
      })();
